# Stack para Portainer (Stacks > Add stack > Repository).
# Las variables ADMIN_USER, ADMIN_PASSWORD y APP_PORT se rellenan en
# «Environment variables» de Portainer; mira .env.example.
services:
  presupuesto:
    build: .
    image: presupuesto:latest
    container_name: presupuesto
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      # Solo se usa la primera vez, cuando aún no hay ninguna cuenta.
      # Si la dejas vacía, la contraseña se genera y aparece en los logs del contenedor.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # auto: cookie segura cuando llega por HTTPS (Cloudflare Tunnel).
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Registro de cuentas nuevas: codigo (con REGISTRO_CODIGO), abierto o cerrado.
      # Cada cuenta registrada tiene su propio presupuesto.
      REGISTRO: ${REGISTRO:-codigo}
      REGISTRO_CODIGO: ${REGISTRO_CODIGO:-}
      TZ: Europe/Madrid
    volumes:
      - presupuesto-datos:/data
    ports:
      # Puerto del servidor al que apuntará Cloudflare Tunnel: http://IP-DEL-SERVIDOR:8085
      - "${APP_PORT:-8085}:3000"

  # Opcional: si quieres que el túnel viva en este mismo stack, descomenta este
  # servicio, pon TUNNEL_TOKEN en las variables de Portainer y, en Cloudflare,
  # apunta el hostname público a http://presupuesto:3000. Entonces puedes quitar «ports».
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  #   depends_on:
  #     - presupuesto

volumes:
  presupuesto-datos:
